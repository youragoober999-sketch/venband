<!DOCTYPE html>
<html>
<body>
<script type="module">
import { imagesToGif } from '/src/lib/gifenc.ts';
const img = new Image();
img.crossOrigin = 'anonymous';
img.src = 'https://picsum.photos/200/200';
img.onload = async () => {
  const canvas = document.createElement('canvas');
  canvas.width = img.width; canvas.height = img.height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  canvas.toBlob(async (blob) => {
    const file = new File([blob], 'test.png', { type: 'image/png' });
    try {
      const gif = await imagesToGif([file], { delayMs: 500 });
      console.log('GIF made:', gif.size, 'bytes');
      const url = URL.createObjectURL(gif);
      const a = document.createElement('a'); a.href = url; a.download = 'test.gif'; a.click();
    } catch (e) {
      console.error('GIF failed:', e);
    }
  }, 'image/png');
};
</script>
</body>
</html>
